  - GRATE_LOC:
      description: |
        You've reached the end of the stream which is actually a dry streambed. Set into the bed is a large steel grate covered in dirt
      destinations:
        - movements: [EAST]
          to: STREAM_ROCK_SLIT_LOC
        - movements: [SOUTH]
          to: FOREST_01_LOC
        - movements: [NORTH]
          to: FOREST_07_LOC
        - movements: [WEST]
          to: FOREST_09_LOC

  - STREAM_ROCK_SLIT_LOC:
      description: |
        The stream of water seeems to be drying up as the water splashes into a 2-inch slit in the rock.
      destinations:
        - movements: [EAST]
          to: WATER_STREAM_LOC
        - movements: [WEST]
          to: GRATE_LOC
  
  - WATER_STREAM_LOC:
      description: |
        a water stream flows along the channel. there seems to be some fishing equipment laid down beside the river
      destinations:
        - movements: [EAST]
          to: WATER_STREAM_LOC
        - movements: [WEST]
          to: GRATE_LOC
  

