# This file contains data structures for the different objects of the game and how they connect to each other. The file should be loaded
# and parsed into code and each object has a distinct structure format
Movements: !!omap
  - NORTH: ["north", "up", "u", "n"]
  - SOUTH: ["down", "d", "south", "s"]
  - EAST: [ "east", "right", "r", "e"]
  - WEST: ["west", "left", "w", "l"]
  - ENTER: ["enter", in]
  - OUT: ["exit", "out"]
  - HOUSE: ["build", "house"]

Actions: !!omap
  - TALK: ["talk", "speak", "chat"]
  - BACK: ["back", "prev", "previous", "backward"]
  - ATTACK: ["attack", "fight", "hit"]
  - DEFEND: ["defend", "block", "shield"]

Hints: !!omap
  - FOREST:
      turns: 3
      question: "Seems like you're stuck in this maze-like forest. Wanna a way out?"
      n_locations: 9
      
Locations: !!omap
  - START_GAME_LOC:
      description: "You're in the middle of the road. There's an old rock building right before you"
      conditions: {}
      region: ABOVE_GROUND
      destinations:
        - movements: [EAST, ENTER, HOUSE]
          to: [ABOVE_GROUND, OLD_BUILDING_LOC]
        - movements: [WEST]
          to: [ABOVE_GROUND, LEVELEDUP_HILL_LOC]
        - movements: [SOUTH]
          to: [ABOVE_GROUND, WATER_STREAM_LOC]

  - OLD_BUILDING_LOC:
      description: "You're inside the building which is actually a well house for a lage spring."
      conditions: {}
      region: ABOVE_GROUND
      destinations:
        - movements: [WEST, OUT]
          to: [ABOVE_GROUND, START_GAME_LOC]

  - LEVELEDUP_HILL_LOC:
      description: "You've walked up a hill, the road is leveled down past the other side. A hiker stands right next to you"
      region: ABOVE_GROUND
      destinations:
        - movements: [EAST]
          to: [ABOVE_GROUND, START_GAME_LOC]
        - movements: [WEST]
          to: [ABOVE_GROUND, END_ROAD_LOC]
      
  - END_ROAD_LOC:
      description: |
        The road coming from the east ends here. You are surrounded by trees. Go further more leads to a small forest
      conditions: {}
      region: ABOVE_GROUND
      destinations:
        - movements: [WEST]
          to: [ABOVE_GROUND, FOREST_06_LOC]
        - movements: [EAST]
          to: [ABOVE_GROUND, LEVELEDUP_HILL_LOC]

