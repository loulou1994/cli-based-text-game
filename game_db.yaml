# This file contains data structures for the different objects of the game and how they connect to each other. The file should be loaded
# and parsed into code and each object has a distinct structure format
Movements: !!omap
  - NORTH: ["north", "up", "u", "n"]
  - SOUTH: ["down", "d", "south", "s"]
  - EAST: [ "east", "right", "r", "e"]
  - WEST: ["west", "left", "w", "l"]
  - ENTER: ["enter", in]
  - OUT: ["exit", "out"]
  - HOUSE: ["build", "house"]

Actions: !!omap
  - TALK: ["talk", "speak", "chat"]
  - BACK: ["back", "prev", "previous", "backward"]
  - ATTACK: ["attack", "fight", "hit"]
  - DEFEND: ["defend", "block", "shield"]


Locations: !!omap
  - START_GAME_LOC:
      description: "You're in the middle of the road. There's an old rock building right before you"
      destinations:
        - movements: [EAST, ENTER, HOUSE]
          to: OLD_BUILDING_LOC
        - movements: [WEST]
          to: LEVELEDUP_HILL_LOC

  - OLD_BUILDING_LOC:
      description: "You're inside the building which is actually a well house for a lage spring."
      destinations:
        - movements: [WEST, OUT]
          to: START_GAME_LOC

  - LEVELEDUP_HILL_LOC:
      description: "You've walked up a hill, the road is leveled down past the other side. A hiker stands right next to you"
      destinations:
        - movements: [EAST]
          to: START_GAME_LOC
        - movements: [WEST]
          to: END_ROAD_LOC
      
  - END_ROAD_LOC:
      description: |
        The road coming from the east ends here. You are surrounded by trees. Go further more  leads to small forest
      destinations:
        - movements: [WEST]
          to: FOREST_06_LOC
        - movements: [EAST]
          to: LEVELEDUP_HILL_LOC

  - FOREST_06_LOC:
      description: You're wandering aimlessly through the forest
      conditions: {forest: true}
      destinations:
        - movements: [NORTH]
          to: END_ROAD_LOC
        - movements: [EAST]
          to: FOREST_05_LOC
        - movements: [SOUTH]
          to: FOREST_03_LOC
        - movements: [WEST]
          to: FOREST_09_LOC

  - FOREST_05_LOC:
      description: You're wandering aimlessly through the forest
      conditions: {forest: true}
      destinations:
        - movements: [NORTH]
          to: FOREST_06_LOC
        - movements: [SOUTH]
          to: FOREST_02_LOC
        - movements: [EAST]
          to: FOREST_04_LOC
        - movements: [WEST]
          to: FOREST_08_LOC

  - FOREST_04_LOC:
      description: You're wandering aimlessly through the forest
      conditions: {forest: true}
      destinations:
        - movements: [EAST]
          to: FOREST_05_LOC
        - movements: [SOUTH]
